<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Emberline — Foundry Yard</title>
<style>
  :root {
    --canvas: #14161a; --surface: #1e2228; --ink: #e9e6df; --muted: #98a0a8;
    --accent: #f0a830; --red: #d43a2e; --teal: #2fa8a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--canvas);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--ink); }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  .layer { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  /* Top bar */
  #topbar { position: absolute; top: 14px; left: 0; right: 0; display: flex;
    justify-content: center; align-items: flex-start; gap: 18px; }
  #timer { font-size: 28px; font-weight: 700; letter-spacing: 2px; background: rgba(20,22,26,.72);
    padding: 4px 16px; border: 1px solid #3a4048; border-radius: 4px; }
  #timer.buy { color: var(--accent); }
  #score { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700;
    background: rgba(20,22,26,.72); padding: 6px 12px; border: 1px solid #3a4048; border-radius: 4px; }
  #score-v { color: var(--accent); }
  #score-s { color: var(--red); }
  .alive { font-size: 12px; color: var(--muted); background: rgba(20,22,26,.72);
    padding: 6px 10px; border: 1px solid #3a4048; border-radius: 4px; margin-top: 4px; }
  #bomb-line { position: absolute; top: 64px; left: 0; right: 0; text-align: center;
    font-size: 13px; letter-spacing: 1px; color: var(--accent); text-shadow: 0 1px 3px #000; }
  /* Bottom-left: health */
  #health { position: absolute; left: 20px; bottom: 20px; width: 240px; }
  #hp-num { font-size: 34px; font-weight: 700; line-height: 1; }
  #hp-label { font-size: 11px; color: var(--muted); letter-spacing: 2px; }
  #hp-track { height: 8px; background: #2a2f36; border: 1px solid #3a4048; margin-top: 6px; }
  #hp-bar { height: 100%; width: 100%; background: var(--ink); }
  /* Bottom-right: weapon / ammo / money */
  #loadout { position: absolute; right: 20px; bottom: 20px; text-align: right; }
  #weapon-name { font-size: 13px; color: var(--muted); letter-spacing: 1px; }
  #ammo-mag { font-size: 40px; font-weight: 700; line-height: 1; }
  #ammo-reserve { font-size: 16px; color: var(--muted); }
  #money { font-size: 18px; color: var(--accent); font-weight: 700; margin-top: 4px; }
  /* Kill feed */
  #feed { position: absolute; right: 20px; top: 14px; text-align: right; font-size: 12px;
    color: var(--muted); white-space: pre-line; line-height: 1.6; text-shadow: 0 1px 2px #000; }
  /* Banner */
  #banner, #banner-sub { position: absolute; left: 0; right: 0; text-align: center;
    opacity: 0; transition: opacity .25s; text-shadow: 0 2px 6px #000; }
  #banner { top: 22%; font-size: 44px; font-weight: 800; letter-spacing: 6px; }
  #banner-sub { top: calc(22% + 54px); font-size: 15px; color: var(--muted); }
  #banner.show, #banner-sub.show { opacity: 1; }
  /* Crosshair */
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --gap: 6px; }
  #crosshair i { position: absolute; background: var(--ink); box-shadow: 0 0 2px #000; }
  #crosshair i:nth-child(1) { left: calc(var(--gap) * -1 - 8px); top: -1px; width: 8px; height: 2px; }
  #crosshair i:nth-child(2) { left: var(--gap); top: -1px; width: 8px; height: 2px; }
  #crosshair i:nth-child(3) { left: -1px; top: calc(var(--gap) * -1 - 8px); width: 2px; height: 8px; }
  #crosshair i:nth-child(4) { left: -1px; top: var(--gap); width: 2px; height: 8px; }
  #crosshair i:nth-child(5) { left: -1px; top: -1px; width: 2px; height: 2px; }
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px;
    margin: -11px 0 0 -11px; opacity: 0; }
  #hitmarker.on { opacity: 1; }
  #hitmarker i { position: absolute; background: #fff; width: 2px; height: 8px; }
  #hitmarker i:nth-child(1) { left: 2px; top: 0; transform: rotate(-45deg); }
  #hitmarker i:nth-child(2) { right: 2px; top: 0; transform: rotate(45deg); }
  #hitmarker i:nth-child(3) { left: 2px; bottom: 0; transform: rotate(45deg); }
  #hitmarker i:nth-child(4) { right: 2px; bottom: 0; transform: rotate(-45deg); }
  #hitmarker.head i { background: var(--red); }
  #dmg { position: absolute; inset: 0; opacity: 0; transition: opacity .15s;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(212,58,46,.55) 100%); }
  #prompt { position: absolute; bottom: 110px; left: 0; right: 0; text-align: center;
    font-size: 13px; color: var(--ink); text-shadow: 0 1px 3px #000; }
  #plant-bar { position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%);
    width: 260px; height: 10px; background: #2a2f36; border: 1px solid #3a4048; }
  #plant-fill { height: 100%; width: 0; background: var(--accent); }
  /* Buy menu */
  #buy { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 480px; background: rgba(20,22,26,.94); border: 1px solid var(--accent);
    padding: 18px 20px; pointer-events: auto; }
  #buy h2 { font-size: 16px; letter-spacing: 3px; color: var(--accent); margin-bottom: 4px; }
  #buy-money { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  .buy-row { display: flex; gap: 10px; align-items: center; padding: 8px 6px;
    border-bottom: 1px solid #2a2f36; font-size: 14px; }
  .buy-row.cur { background: rgba(240,168,48,.12); }
  .buy-key { width: 22px; height: 22px; border: 1px solid var(--muted); color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
  .buy-name { flex: 1; }
  .buy-price { color: var(--accent); font-weight: 700; }
  .buy-note { margin-top: 12px; font-size: 11px; color: var(--muted); line-height: 1.5; }
  /* Start / pause overlay */
  #overlay { position: fixed; inset: 0; background: rgba(12,13,16,.82); z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; pointer-events: auto; }
  #overlay[hidden], #buy[hidden], #plant-bar[hidden] { display: none; }
  #overlay-title { font-size: 52px; font-weight: 800; letter-spacing: 10px; color: var(--accent);
    text-shadow: 0 4px 24px rgba(240,168,48,.35); }
  #overlay-copy { max-width: 560px; margin: 16px 0 28px; font-size: 14px; line-height: 1.7;
    color: var(--muted); }
  #play { font: inherit; font-size: 16px; letter-spacing: 2px; font-weight: 700; cursor: pointer;
    background: var(--accent); color: #14161a; border: 0; padding: 14px 34px; border-radius: 4px; }
  #play:hover { filter: brightness(1.1); }
</style>
</head>
<body>
<div id="game"></div>
<div class="layer">
  <div id="dmg"></div>
  <div id="topbar">
    <div class="alive" id="alive-v">Vanguard 3</div>
    <div id="score"><span id="score-v">0</span><span>:</span><span id="score-s">0</span></div>
    <div id="timer">1:40</div>
    <div class="alive" id="alive-s">Sentinels 4</div>
  </div>
  <div id="bomb-line"></div>
  <div id="feed"></div>
  <div id="banner"></div>
  <div id="banner-sub"></div>
  <div id="crosshair"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="hitmarker"><i></i><i></i><i></i><i></i></div>
  <div id="health">
    <div id="hp-num">100</div>
    <div id="hp-label">HEALTH</div>
    <div id="hp-track"><div id="hp-bar"></div></div>
  </div>
  <div id="loadout">
    <div id="weapon-name">P9 Sidearm</div>
    <div><span id="ammo-mag">12</span> <span id="ammo-reserve">/ 48</span></div>
    <div id="money">$800</div>
  </div>
  <div id="prompt"></div>
  <div id="plant-bar" hidden><div id="plant-fill"></div></div>
  <div id="buy" hidden>
    <h2>BUY MENU</h2>
    <div id="buy-money">$800</div>
    <div id="buy-list"></div>
  </div>
</div>
<div id="overlay">
  <div id="overlay-title">EMBERLINE</div>
  <div id="overlay-copy">Foundry Yard — Vanguard attacks, Sentinels defend. Plant the bomb at Foundry or Depot, or eliminate the other team. Click to play.</div>
  <button id="play">Click to play</button>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
